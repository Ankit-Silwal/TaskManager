# Redis: 1 pod (Deployment) + a stable name "redis:6379" inside the cluster (Service)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: taskmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis          # "the pods I manage are the ones tagged app=redis"
  template:               # recipe for each pod
    metadata:
      labels:
        app: redis        # the tag every pod gets
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          # same as the compose healthcheck: traffic only goes to the pod once this passes
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: taskmanager
spec:
  selector:
    app: redis            # send traffic to every pod tagged app=redis
  ports:
    - port: 6379
      targetPort: 6379
