services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: taskmanager
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d taskmanager"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/taskmanager
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://app:app@postgres:5432/taskmanager
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: http://localhost:3000
      TRUST_PROXY: 1
      # "off" disables the task list cache, e.g. `$env:TASK_CACHE="off"; docker compose up -d`
      TASK_CACHE: ${TASK_CACHE:-on}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Docker calls /health inside the container. Exit 0 = healthy, 1 = unhealthy.
    # The slim image has no curl, so node's built-in fetch does the request.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
  worker:
    build: ./backend
    command: ["node","dist/worker.js"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/taskmanager
      CLEANUP_INTERVAL: 600000
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      - backend

  nginx:
    image: nginx:1.27
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  promdata:
